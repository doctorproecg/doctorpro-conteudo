name: Publicar no Instagram

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília. Segunda, quarta e sexta.
    # O cron do GitHub pode atrasar alguns minutos em horário de pico — é normal.
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (YYYY-MM-DD). Vazio = hoje.'
        required: false
      seco:
        description: 'Simular sem publicar'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node publicar.js \
            ${{ inputs.data && format('--data {0}', inputs.data) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

      - name: Registrar publicação na fila
        if: ${{ !inputs.seco }}
        run: |
          if git diff --quiet fila.json; then
            echo "fila.json não mudou (nada publicado hoje)."
            exit 0
          fi
          git config user.name  'doctor-pro-bot'
          git config user.email 'bot@doctorpro.local'
          git add fila.json
          git commit -m "publica post de $(TZ=America/Sao_Paulo date +%F)"
          git push
