name: Publicar no Instagram

on:
  schedule:
    # Publica só se houver post aprovado com data igual a hoje (a data de cada
    # post no fila.json manda no calendário).
    #
    # ESCADA DE TENTATIVAS. O agendador do GitHub é "melhor esforço": ele atrasa
    # e às vezes DESCARTA a execução em silêncio (aconteceu em 16/07/2026, com
    # cron na hora cheia). Como o script pula post que já está 'publicado', várias
    # tentativas por dia são inofensivas e dão redundância: a primeira que o
    # GitHub honrar publica, as demais saem sem fazer nada.
    #
    # Minutos quebrados de propósito — a hora cheia é o horário mais congestionado.
    - cron: '53 10 * * *'   # 07:53 BRT · alvo principal (post cai ~8h)
    - cron: '23 11 * * *'   # 08:23 BRT · rede 1
    - cron: '53 11 * * *'   # 08:53 BRT · rede 2
    - cron: '53 12 * * *'   # 09:53 BRT · rede 3 (última chance do dia)
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (YYYY-MM-DD). Vazio = hoje.'
        required: false
      seco:
        description: 'Simular sem publicar'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node publicar.js \
            ${{ inputs.data && format('--data {0}', inputs.data) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

      - name: Registrar publicação na fila
        if: ${{ !inputs.seco }}
        run: |
          if git diff --quiet fila.json; then
            echo "fila.json não mudou (nada publicado hoje)."
            exit 0
          fi
          git config user.name  'doctor-pro-bot'
          git config user.email 'bot@doctorpro.local'
          git add fila.json
          git commit -m "publica post de $(TZ=America/Sao_Paulo date +%F)"
          git push
