name: Publicar no Instagram

on:
  schedule:
    # Roda TODO dia; publica só se houver post aprovado com data igual a hoje
    # (a data de cada post no fila.json manda no calendário).
    #
    # O cron do GitHub é "melhor esforço" e atrasa de 5 a 15 min, principalmente
    # na hora cheia (todo mundo agenda :00). Por isso miramos ANTES e num minuto
    # quebrado: 10:53 UTC = 07:53 BRT, e com o atraso o post cai por volta das 8h.
    - cron: '53 10 * * *'
    # Temporário: garante o post de 16/07, cuja execução das 09:00 ficou atrasada
    # na fila. Publicar duas vezes no mesmo dia é inofensivo (o script pula post
    # que já está 'publicado'). Remover depois.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (YYYY-MM-DD). Vazio = hoje.'
        required: false
      seco:
        description: 'Simular sem publicar'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node publicar.js \
            ${{ inputs.data && format('--data {0}', inputs.data) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

      - name: Registrar publicação na fila
        if: ${{ !inputs.seco }}
        run: |
          if git diff --quiet fila.json; then
            echo "fila.json não mudou (nada publicado hoje)."
            exit 0
          fi
          git config user.name  'doctor-pro-bot'
          git config user.email 'bot@doctorpro.local'
          git add fila.json
          git commit -m "publica post de $(TZ=America/Sao_Paulo date +%F)"
          git push
