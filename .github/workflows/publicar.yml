name: Publicar no Instagram

on:
  # Quem manda a hora é o AGENDADOR NO CLOUDFLARE (publicacao/agendador/), que
  # chama este workflow por workflow_dispatch às 07:50 BRT, com uma segunda
  # tentativa às 09:40. O fila.json continua decidindo o que sai: só post
  # 'aprovado' com a data de hoje vai ao ar.
  #
  # A ESCADA DE 4 CRONS FOI REMOVIDA EM 06/08/2026 — não recolocar.
  # Ela existia como rede de segurança, mas nunca segurou nada: o cron do GitHub
  # é "melhor esforço" e descartou as execuções em 16/07, em 17/07 (nos dois dias
  # o post só saiu no disparo manual) e de novo em 06/08, quando o GitHub
  # cancelou as tentativas do dia horas depois do horário e mandou 3 e-mails de
  # falha por execuções que nunca rodaram. Rede que só dá alarme falso não é rede.
  #
  # Consequência: o Worker do Cloudflare virou ponto único. Se o post parar de
  # sair, o suspeito nº 1 é o TOKEN DO GITHUB TER VENCIDO — ele falha calado.
  # O passo a passo pra renovar está em publicacao/agendador/README.md.
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (YYYY-MM-DD). Vazio = hoje.'
        required: false
      seco:
        description: 'Simular sem publicar'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Opcional: sem este secret, publica só no Instagram (como antes).
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node publicar.js \
            ${{ inputs.data && format('--data {0}', inputs.data) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

      - name: Registrar publicação na fila
        if: ${{ !inputs.seco }}
        run: |
          if git diff --quiet fila.json; then
            echo "fila.json não mudou (nada publicado hoje)."
            exit 0
          fi
          git config user.name  'doctor-pro-bot'
          git config user.email 'bot@doctorpro.local'
          git add fila.json
          git commit -m "publica post de $(TZ=America/Sao_Paulo date +%F)"
          git push
